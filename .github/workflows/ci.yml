name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv (exact pin — major tags discontinued at v8)
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint (ruff check + format gate)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test suite with coverage floor
        run: uv run pytest --cov=saathi --cov-report=term-missing --cov-fail-under=70
