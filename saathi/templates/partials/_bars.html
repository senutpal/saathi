{% macro bars(pairs, total_cents) -%}
<ul class="space-y-2">
  {%- for label, cents in pairs.items() -%}
  <li>
    <div class="flex items-center justify-between text-xs">
      <span class="font-medium capitalize">{{ label }}</span>
      <span class="tabular-nums text-muted-foreground">{{ cents|money }}</span>
    </div>
    {#- data-driven width is the one sanctioned inline style (chart geometry) -#}
    <div class="mt-1 h-1.5 w-full rounded-full bg-muted">
      <div class="h-1.5 rounded-full bg-primary" style="width: {{ ((cents / total_cents * 100) | round(0)) | int }}%"></div>
    </div>
  </li>
  {%- endfor -%}
</ul>
{%- endmacro %}
