{% if bell_items %}
<div class="invisible absolute right-0 z-40 mt-1 w-80 rounded-lg border border-border bg-card p-2 opacity-0 shadow-lg transition-opacity group-hover:visible group-hover:opacity-100 group-focus-within:visible group-focus-within:opacity-100">
  {% for n in bell_items %}
  <a href="{{ url_for('notifications.inbox') }}" class="block rounded-md px-3 py-2 hover:bg-accent">
    <span class="block text-sm font-medium">{{ n.title }}</span>
    <span class="block text-xs tabular-nums text-muted-foreground">{{ n.created_at|ist }}</span>
  </a>
  {% endfor %}
  <a href="{{ url_for('notifications.inbox') }}"
     class="mt-1 block rounded-md border-t border-border px-3 pt-2 text-xs text-muted-foreground hover:text-foreground">Open inbox</a>
</div>
{% endif %}
