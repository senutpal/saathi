{# Email clients strip <style> and classes; inline styling is the constraint here. #}
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;border:1px solid #e4e4e7;border-radius:8px;">
  <p style="margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#71717a;">Saathi reminder</p>
  <p style="margin:0 0 12px;font-size:16px;font-weight:bold;color:#09090b;">{{ title }}</p>
  {% if body %}<p style="margin:0 0 16px;font-size:14px;color:#3f3f46;">{{ body }}</p>{% endif %}
  {% if link %}<p style="margin:0;font-size:14px;"><a href="{{ link }}" style="color:#09090b;">Open your inbox</a></p>{% endif %}
</div>
